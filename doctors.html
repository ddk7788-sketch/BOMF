<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ebe1d0" />
    <meta name="description" content="봄꽃한의원 의료진 소개" />
    <title>의료진 소개 | 봄꽃한의원</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="care-page doctors-page">
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="index.html#top" aria-label="봄꽃한의원 홈"><img src="assets/bomkkot-wordmark.png" alt="봄꽃한의원" /></a>
        <nav class="main-nav" aria-label="주 메뉴"><a class="nav-link" href="index.html#services">진료 안내</a><a class="nav-link" href="index.html#doctors" aria-current="page">의료진</a><a class="nav-link" href="index.html#visit">이용 안내</a></nav>
        <a class="button button-dark appointment-button" href="index.html#visit">방문 안내</a>
      </div>
    </header>
    <main id="main">
      <nav class="care-breadcrumb section-wrap" aria-label="현재 위치"><a href="index.html#top">홈</a><span aria-hidden="true">/</span><span aria-current="page">의료진</span></nav>
      <section class="team-page section-wrap" aria-labelledby="teamTitle">
        <header class="team-page-heading">
          <p class="eyebrow"><span class="eyebrow-rule"></span> BOMKKOT · MEDICAL TEAM</p>
          <h1 id="teamTitle">봄꽃한의원 의료진</h1>
          <p>의료진의 사진과 학력·경력, 학회 활동을 소개합니다.</p>
        </header>
        <div class="team-carousel" data-team-carousel aria-roledescription="carousel" aria-label="의료진 프로필">
          <div class="team-slides" data-team-slides aria-live="polite"></div>
          <div class="team-controls">
            <button class="team-arrow" type="button" data-team-prev aria-label="이전 의료진"><span aria-hidden="true">←</span></button>
            <div class="team-pagination" data-team-pagination aria-label="의료진 선택"></div>
            <button class="team-arrow" type="button" data-team-next aria-label="다음 의료진"><span aria-hidden="true">→</span></button>
          </div>
          <p class="team-position" data-team-position aria-live="polite"></p>
        </div>
      </section>
    </main>
    <footer class="site-footer"><div class="section-wrap"><a class="text-link" href="index.html#top">봄꽃한의원 홈으로 돌아가기</a></div></footer>
    <script src="doctors.js" defer></script>
  </body>
</html>
